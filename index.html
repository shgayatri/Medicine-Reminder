<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Reminder App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>💊 Medicine Reminder</h1>
        <p>Stay healthy. Stay on time.</p>
    </div>

    <div class="card">
        <h2>Add Reminder</h2>

        <input type="text" id="medicineName" placeholder="Enter medicine name">
        <input type="time" id="medicineTime">
        <textarea id="medicineNote" placeholder="Add a note (optional)"></textarea>

        <button onclick="addReminder()" class="add-btn">➕ Add Reminder</button>
    </div>

    <h2 class="list-title">⏳ Your Reminders</h2>
    <div id="reminderList" class="list-container"></div>
